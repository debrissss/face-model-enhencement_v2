[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-model-enhancement"
version = "0.1.0"
description = "Landmark-derived eye/mouth regions and frontal normal integration in millimeters"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26.4,<2", "scipy>=1.13,<1.18", "Pillow>=10", "trimesh>=4",
    "vtk>=9.3", "opencv-contrib-python==4.11.0.86", "PyYAML>=6",
    "matplotlib>=3.8",
]

[project.scripts]
face-model-enhance = "face_model_enhancement.cli:main"

